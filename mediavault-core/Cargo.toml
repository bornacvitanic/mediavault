[package]
name = "mediavault-core"
version = "0.1.1"
description = "Core library for MediaVault — scanning, sidecar I/O, TMDB integration, and metadata parsing"
authors.workspace = true
license-file.workspace = true
repository.workspace = true
edition.workspace = true
readme = "../README.md"
keywords = ["media", "library", "tmdb", "metadata", "sidecar"]
categories = ["multimedia", "filesystem"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
# TMDB poster fetching (blocking, keeps things simple for now)
ureq = { version = "2", features = ["json"] }
serde_json = "1"
# Natural sort for episode filenames (S01E01, 1x01, etc.)
natord = "1"
urlencoding = "2"
dirs-next = "2"
