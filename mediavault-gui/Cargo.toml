[package]
name = "mediavault-gui"
version = "0.1.0"
description = "Desktop GUI for MediaVault — browse, watch-track, and manage your media library"
authors.workspace = true
license-file.workspace = true
repository.workspace = true
edition.workspace = true
keywords = ["media", "gui", "egui", "movies", "tracker"]
categories = ["multimedia", "gui"]

[[bin]]
name = "mediavault"
path = "src/main.rs"

[dependencies]
mediavault-core = { path = "../mediavault-core", version = "0.1.0" }
eframe = { version = "0.27", features = ["default", "persistence"] }
egui = "0.27"
# Load poster images into egui textures
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Spawn background threads for TMDB fetching without blocking the UI
crossbeam-channel = "0.5"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
# Native folder picker dialog
rfd = "0.14"
