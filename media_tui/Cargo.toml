[package]
name = "media_tui"
version = "0.1.0"
description = "TUI frontend for MediaVault — browse and manage your media library in the terminal"
authors.workspace = true
license-file.workspace = true
repository.workspace = true
edition.workspace = true
keywords = ["media", "tui", "ratatui", "movies", "tracker"]
categories = ["command-line-utilities", "multimedia"]

[[bin]]
name = "mediavault-tui"
path = "src/main.rs"

[dependencies]
media_core = { path = "../media_core" }
ratatui = "0.29"
crossterm = "0.28"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0.102"