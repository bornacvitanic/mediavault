[package]
name = "media_core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
# TMDB poster fetching (blocking, keeps things simple for now)
ureq = { version = "2", features = ["json"] }
serde_json = "1"
# Natural sort for episode filenames (S01E01, 1x01, etc.)
natord = "1"
urlencoding = "2"
dirs-next = "2"
