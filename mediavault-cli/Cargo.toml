[package]
name = "mediavault-cli"
version = "0.1.4"
description = "CLI frontend for MediaVault — query and manage your media library from the terminal"
authors.workspace = true
license-file.workspace = true
repository.workspace = true
edition.workspace = true
readme = "../README.md"
keywords = ["media", "cli", "movies", "tracker", "terminal"]
categories = ["command-line-utilities", "multimedia"]

[[bin]]
name = "mediavault-cli"
path = "src/main.rs"

[dependencies]
mediavault-core = { path = "../mediavault-core", version = "0.1.4" }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
